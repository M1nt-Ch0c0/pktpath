name: CI

on:
  push:
    branches: [main, "preview/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bpf-and-collectors:
    name: BPF (arm64 + x86_64) & Device Collectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang, llvm & cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm gcc gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Install Python build dependencies
        run: python3 -m pip install -r requirements-build.txt

      - name: Build dual-arch eBPF bytecode headers
        run: python3 scripts/build_bpf.py --arch all

      - name: Build static Linux x86_64 & arm64 collectors
        run: |
          python3 scripts/build_device.py --target linux-x86_64
          python3 scripts/build_device.py --target linux-arm64
          file bin/pktpath-linux-x86_64 bin/pktpath-linux-arm64

  android-arm64-ndk:
    # Independent compile-only check. Installs official NDK r28b and compiles
    # the Android arm64 collector. Success here is not on-device or kernel evidence.
    name: Android arm64 collector (NDK compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache official Android NDK r28b
        uses: actions/cache@v4
        with:
          path: ~/.cache/pktpath-ci/android-ndk-r28b
          key: ndk-r28b-linux-e9f2759862cecfd48c20bbb7d8cfedbb020f4d91b5f78d9a2fc106f7db3c27ed

      - name: Install official Android NDK r28b
        run: bash scripts/ci_install_ndk.sh "$HOME/.cache/pktpath-ci/android-ndk-r28b"

      - name: Build Android arm64 collector (NDK)
        run: |
          python3 scripts/build_device.py --target android-arm64
          file bin/pktpath-android-arm64

  python-tests:
    name: Python Analyzer & Plugin Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unittest suite
        run: python -m unittest discover -s tests -v

  cordis-studio:
    name: Pure Cordis Studio (Node v24.22.1 TS & Unit Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: "npm"
          cache-dependency-path: studio-cordis/package-lock.json

      - name: Install pure Cordis dependencies
        working-directory: studio-cordis
        run: npm ci --ignore-scripts

      - name: Check Node 24 TypeScript type-stripping syntax (erasableSyntaxOnly)
        working-directory: studio-cordis
        run: |
          node -e '
            import fs from "node:fs";
            import path from "node:path";
            import { execFileSync } from "node:child_process";
            function walk(dir, out = []) {
              if (!fs.existsSync(dir)) return out;
              for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, ent.name);
                if (ent.isDirectory()) walk(full, out);
                else if (ent.name.endsWith(".ts") || ent.name.endsWith(".mjs") || ent.name.endsWith(".js")) out.push(full);
              }
              return out;
            }
            const files = [...walk("src"), ...walk("web"), ...walk("test")];
            for (const f of files) {
              execFileSync(process.execPath, ["--check", f], { stdio: "inherit" });
            }
            console.log(`SYNTAX_OK ${files.length} files`);
          '

      - name: Run Cordis check script (npm run check)
        working-directory: studio-cordis
        run: |
          if node -e 'const p = JSON.parse(require("node:fs").readFileSync("package.json","utf8")); process.exit(p.scripts && p.scripts.check ? 0 : 1)'; then
            npm run check
          elif node -e 'const p = JSON.parse(require("node:fs").readFileSync("package.json","utf8")); process.exit(p.scripts && p.scripts.typecheck ? 0 : 1)'; then
            npm run typecheck
          else
            echo "ERROR: studio-cordis/package.json must define scripts.check (or scripts.typecheck)" >&2
            exit 1
          fi

      - name: Run Cordis Studio test suite
        working-directory: studio-cordis
        run: |
          if node -e 'const p = JSON.parse(require("node:fs").readFileSync("package.json","utf8")); process.exit(p.scripts && p.scripts.test ? 0 : 1)'; then
            npm test
          else
            node --test "test/**/*.test.ts"
          fi

  packaging-and-assets:
    name: Packaging Scripts, Licenses & Asset Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check packaging and collector build scripts
        run: python3 -W error -m py_compile scripts/package_preview_bundle.py scripts/build_bpf.py scripts/build_device.py
      - name: Verify root LICENSE, SVG & JSON assets
        run: |
          test -f LICENSE
          python3 -c '
          import json, pathlib, xml.etree.ElementTree as ET
          for p in pathlib.Path("assets").glob("*.svg"):
              ET.parse(p)
          web_favicon = pathlib.Path("studio-cordis/web/favicon.svg")
          if web_favicon.is_file():
              ET.parse(web_favicon)
          for p in pathlib.Path("plugins").rglob("*.json"):
              json.loads(p.read_text(encoding="utf-8"))
          print("ASSETS_AND_MANIFESTS_OK")
          '
